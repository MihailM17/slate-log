[package]
name = "slate-log"
version = "0.8.4"
description = "Lightweight scene & take tracker for film shoots"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "slate_log_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-opener = { version = "2" }
tauri-plugin-updater = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.90"
csv = "1"
pdf-extract = "0.7"
flate2 = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["net", "rt"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
base64 = "0.22"
printpdf = "0.7"
chrono = { version = "0.4", features = ["serde", "clock"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
